function attPrep(f){return new Promise((res,rej)=>{if(f.type=="application/pdf"){if(f.size>487000)return rej(new Error("ملف PDF أكبر من 650 كيلوبايت. استخدم صورة أو صغّر الملف"));const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("تعذر قراءة الملف"));r.readAsDataURL(f);return}
 const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let m=1600,q=.72,out;for(;;){const k=Math.min(1,m/Math.max(im.width,im.height)),cv2=document.createElement("canvas");cv2.width=Math.round(im.width*k);cv2.height=Math.round(im.height*k);cv2.getContext("2d").drawImage(im,0,0,cv2.width,cv2.height);out=cv2.toDataURL("image/jpeg",q);if(out.length<=800000||m<500)break;m=Math.round(m*.8);q=Math.max(.5,q-.05)}URL.revokeObjectURL(u);res(out)};im.onerror=()=>rej(new Error("تعذر قراءة الصورة"));im.src=u})}
